[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -m "not port_conflict" --strict-markers
markers =
    integration: needs a live Godot editor (skipped when no handshake answers)
    port_conflict: kills and restarts the Godot editor; run it on its own
filterwarnings =
    ignore::DeprecationWarning
